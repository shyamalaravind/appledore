schema_version: "1.1"
name: deep-dive-writes-after-yes
description: >-
  On the user's yes to a deep dive's proposal, the left-out stub joins the learning graph, the new
  node is written as a planned stub, and the graph is redrawn, with no subtopic written yet.
tags: [deep-dive, plan, multi-turn]
context:
  scaffold_script: scaffold.sh
  history_file: history.jsonl
execution:
  prompt: >-
    1 yes, 2 yes.
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  append_system_prompt: >-
    The study vault for this session is the folder `vault` in the current working directory, and
    the shell sets APPLEDORE_VAULT to it.
