schema_version: "1.1"
name: sources-dont-cover
description: >-
  A question the agreed sources don't cover gets "the agreed sources don't cover it" and a
  proposal of pages, never an answer from memory.
tags: [file, sources]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Continue studying HTTP caching. Before the next subtopic, a question about [[HTTP cache]]:
    how does a CDN purge request work, and how long does a purge take to reach every edge
    server?
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  append_system_prompt: >-
    The study vault for this session is the folder `vault` in the current working directory, and
    the shell sets APPLEDORE_VAULT to it.
