schema_version: "1.1"
name: next-writes-subtopic
description: >-
  "next" with one ready node writes that subtopic from its stub, in the fixed shape: In short,
  Example, the parts, In an interview, Left out on purpose and Sources.
tags: [learn]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Continue studying HTTP caching: next.
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  append_system_prompt: >-
    The study vault for this session is the folder `vault` in the current working directory, and
    the shell sets APPLEDORE_VAULT to it.
